<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة موزع الأغذية والمشروبات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --primary:#0f766e; --primary-dark:#0b5c56; --accent:#f59e0b;
    --bg:#f4f7f6; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --danger:#dc2626; --success:#16a34a; --border:#e5e7eb;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--primary);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.1);flex-wrap:wrap;gap:8px;}
  header h1{font-size:16px;margin:0;}
  header .actions{display:flex;gap:8px;flex-wrap:wrap;}
  header button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;}
  nav{display:flex;gap:4px;overflow-x:auto;background:#fff;padding:8px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;}
  nav button{background:none;color:var(--muted);white-space:nowrap;padding:8px 14px;border-radius:20px;font-size:13px;border:none;cursor:pointer;}
  nav button.active{background:var(--primary);color:#fff;}
  main{padding:16px;max-width:1100px;margin:0 auto;}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px;font-family:inherit;background:#fff;}
  button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-secondary{background:#e5e7eb;color:#374151;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-export{background:#e0f2f1;color:var(--primary-dark);}
  .btn-edit{background:#dbeafe;color:#1d4ed8;padding:5px 9px;font-size:11px;margin-left:4px;}
  .btn-del{background:#fee2e2;color:var(--danger);padding:5px 9px;font-size:11px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-right:4px solid var(--primary);}
  .card .val{font-size:22px;font-weight:700;color:var(--primary-dark);}
  .card .lbl{font-size:12px;color:var(--muted);margin-top:4px;}
  .panel{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .panel-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px;flex-wrap:wrap;gap:6px;}
  .panel-head h2{font-size:15px;margin:0;color:var(--primary-dark);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{background:#f0fdfa;color:var(--primary-dark);font-weight:600;}
  tr:hover{background:#fafafa;}
  .table-wrap{overflow-x:auto;}
  .tag{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag-ok{background:#dcfce7;color:var(--success);}
  .tag-warn{background:#fee2e2;color:var(--danger);}
  .tag-late{background:#fee2e2;color:var(--danger);}
  .tag-due{background:#fef3c7;color:#b45309;}
  .tag-paid{background:#dcfce7;color:var(--success);}
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
  .line-item{display:grid;grid-template-columns:2fr 0.8fr auto;gap:6px;align-items:center;margin-bottom:6px;}
  .btn-add-line{background:#e0f2f1;color:var(--primary-dark);margin-bottom:12px;}
  .btn-remove{background:#fee2e2;color:var(--danger);padding:6px 10px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:100;display:none;max-width:90vw;text-align:center;}
  .hidden{display:none !important;}
  .total-line{text-align:left;font-weight:700;margin-top:8px;color:var(--primary-dark);}
  .empty{color:#999;text-align:center;padding:20px;}
  .edit-badge{background:#fef3c7;color:#b45309;padding:4px 10px;border-radius:6px;font-size:12px;margin-bottom:10px;display:inline-block;}
</style>
</head>
<body>

<header>
  <h1>🥤 نظام إدارة الموزع - أحمد محمود أحمد برعى</h1>
  <div class="actions">
    <button onclick="exportAllToExcel()">📊 تصدير الكل Excel</button>
    <button onclick="exportAllData()">⬇️ نسخة احتياطية JSON</button>
    <button onclick="triggerImport()">⬆️ استيراد نسخة احتياطية</button>
    <button onclick="lockApp()">🔒 قفل النظام</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<input type="file" id="import-file" class="hidden" accept=".json" onchange="importAllData(this.files[0])">
<input type="file" id="import-excel-file" class="hidden" accept=".xlsx,.xls" onchange="handleImportExcel(this.files[0])">
<div class="toast" id="toast"></div>

<div id="lock-screen" style="display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#0f766e,#0b5c56);align-items:center;justify-content:center;z-index:200;">
  <div style="background:#fff;padding:36px 28px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(320px,88vw);text-align:center;">
    <div style="font-size:36px;margin-bottom:8px">🔒</div>
    <h2 style="font-size:18px;color:#0b5c56;margin:0 0 6px">نظام إدارة الموزع</h2>
    <p style="font-size:13px;color:#6b7280;margin:0 0 18px">مصرح فقط للمستخدمين المعتمدين من صاحب النظام</p>
    <input id="lock-pass" type="password" placeholder="كلمة السر" style="margin-bottom:10px" onkeydown="if(event.key==='Enter') tryUnlock()">
    <button class="btn-primary" style="width:100%" onclick="tryUnlock()">دخول</button>
    <div id="lock-error" style="color:#dc2626;font-size:13px;margin-top:10px"></div>
  </div>
</div>

<script>
/* ============================================================
   نظام إدارة موزع الأغذية والمشروبات - نسخة أوفلاين بالكامل
   - يعمل من غير إنترنت وبدون أي حساب جوجل (باستثناء تحميل مكتبة تصدير Excel)
   - مستخدم واحد فقط، بدون تسجيل دخول
   - كل البيانات محفوظة داخل المتصفح (localStorage)
   - كل صفحة فيها إضافة / تعديل / حذف، وزرار تصدير Excel لكل جدول
   ============================================================ */

const DB_KEY = 'bar3y_offline_db_v1';

function emptyDB(){
  return {
    items: [], purchases: [], sales: [], sellers: [], customers: [],
    suppliers: [], supplierPayments: [], debts: [], expenses: [],
    treasuryEntries: [], funders: [],
    settings: { capital: 0 }
  };
}

let DB = loadDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    const db = Object.assign(emptyDB(), parsed);
    db.settings = Object.assign({capital:0}, parsed.settings || {});
    return db;
  }catch(e){ return emptyDB(); }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

/* حالة التعديل الحالية لكل كيان (id السجل الجاري تعديله أو null) */
const EDIT = { items:null, customers:null, suppliers:null, sellers:null, supplierPayments:null, expenses:null, funders:null, treasuryEntries:null };

function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#dc2626' : '#1f2937';
  t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 2600);
}
function fmt(n){ return (Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2}); }
function fmtDate(v){ if(!v) return '-'; const d = new Date(v); if(isNaN(d)) return v; return d.toLocaleDateString('ar-EG'); }
function today(){ return new Date().toISOString().split('T')[0]; }
function thisMonth(){ return new Date().toISOString().slice(0,7); }
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function nextCode(list, prefix, digits){ return prefix + String(list.length+1).padStart(digits,'0'); }
function nextInvoiceNo(list, key, prefix, digits){
  const nums = new Set(list.map(r=>r[key]).filter(Boolean));
  return prefix + String(nums.size+1).padStart(digits,'0');
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function confirmDelete(msg){ return confirm(msg || 'هل أنت متأكد من الحذف؟ لا يمكن التراجع عن هذا الإجراء.'); }

/* ================== تصدير Excel (xlsx) ================== */
function exportXLSX(rows, filename){
  if(!rows.length){ toast('لا توجد بيانات لتصديرها', true); return; }
  const headers = Object.keys(rows[0]).filter(k=>k!=='id');
  const data = rows.map(r=>{
    const obj = {};
    headers.forEach(h=> obj[h] = r[h] ?? '');
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(data, {header: headers});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, filename.slice(0,31));
  XLSX.writeFile(wb, filename + '.xlsx');
}
function exportAllToExcel(){
  const sheets = {
    'الأصناف': DB.items, 'المخزون': computeStock(), 'المشتريات': DB.purchases,
    'المبيعات': DB.sales, 'العملاء': computeCustomers(), 'الموردون': computeSuppliers(),
    'البائعين': computeSellers(), 'مديونات_التجار': computeDebts(),
    'مدفوعات_الموردين': DB.supplierPayments, 'المصروفات': DB.expenses,
    'الخزينة_والبنك': computeTreasury().entries, 'تقرير_الأرباح': computeMonthlyProfit(),
    'الممول': computeFunders()
  };
  const wb = XLSX.utils.book_new();
  let any = false;
  Object.keys(sheets).forEach(name=>{
    const rows = sheets[name];
    if(!rows.length) return;
    any = true;
    const headers = Object.keys(rows[0]).filter(k=>k!=='id');
    const data = rows.map(r=>{ const o={}; headers.forEach(h=> o[h]=r[h]??''); return o; });
    const ws = XLSX.utils.json_to_sheet(data, {header: headers});
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  });
  if(!any){ toast('لا توجد بيانات لتصديرها بعد', true); return; }
  XLSX.writeFile(wb, 'نظام_برعى_' + today() + '.xlsx');
  toast('تم تصدير ملف إكسل شامل لكل الجداول');
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportAllData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  downloadBlob(blob, 'نسخة_احتياطية_' + today() + '.json');
  toast('تم تصدير نسخة احتياطية كاملة');
}
function triggerImport(){ document.getElementById('import-file').click(); }

/* ================== تحميل قالب Excel واستيراد بيانات بالجملة ================== */
const TEMPLATE_HEADERS = {
  items: ['اسم الصنف','الفئة','العلامة التجارية','سعر الشراء','سعر البيع','الحد الأدنى للمخزون','المورد الرئيسي','مدة الصلاحية (أيام)'],
  customers: ['اسم العميل','رقم الهاتف','العنوان'],
  suppliers: ['اسم المورد','رقم الهاتف','العنوان']
};
const TEMPLATE_FILENAMES = { items:'قالب_الأصناف', customers:'قالب_العملاء', suppliers:'قالب_الموردين' };
function downloadTemplate(type){
  const headers = TEMPLATE_HEADERS[type];
  const ws = XLSX.utils.aoa_to_sheet([headers]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'قالب');
  XLSX.writeFile(wb, TEMPLATE_FILENAMES[type] + '.xlsx');
  toast('تم تحميل القالب - املأ الأعمدة ثم استخدم "استيراد إكسيل"');
}
let IMPORT_TYPE = null;
function triggerImportExcel(type){
  IMPORT_TYPE = type;
  document.getElementById('import-excel-file').click();
}
function handleImportExcel(file){
  if(!file || !IMPORT_TYPE) return;
  const type = IMPORT_TYPE;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      let count = 0, skipped = 0;
      if(type==='items'){
        rows.forEach(r=>{
          const name = String(r['اسم الصنف']||'').trim();
          if(!name){ skipped++; return; }
          const code = nextCode(DB.items, 'IT', 4);
          DB.items.push({id:uid(), code, name, category:r['الفئة']||'', brand:r['العلامة التجارية']||'',
            buyPrice:Number(r['سعر الشراء']||0), sellPrice:Number(r['سعر البيع']||0),
            minStock:Number(r['الحد الأدنى للمخزون']||0), mainSupplier:r['المورد الرئيسي']||'',
            shelfLifeDays:Number(r['مدة الصلاحية (أيام)']||0)});
          count++;
        });
        saveDB(); renderItems();
      }else if(type==='customers'){
        rows.forEach(r=>{
          const name = String(r['اسم العميل']||'').trim();
          if(!name){ skipped++; return; }
          const code = nextCode(DB.customers, 'CU', 4);
          DB.customers.push({id:uid(), code, name, phone:r['رقم الهاتف']||'', address:r['العنوان']||''});
          count++;
        });
        saveDB(); renderCustomers();
      }else if(type==='suppliers'){
        rows.forEach(r=>{
          const name = String(r['اسم المورد']||'').trim();
          if(!name){ skipped++; return; }
          const code = nextCode(DB.suppliers, 'SU', 4);
          DB.suppliers.push({id:uid(), code, name, phone:r['رقم الهاتف']||'', address:r['العنوان']||''});
          count++;
        });
        saveDB(); renderSuppliers();
      }
      toast(`تم استيراد ${count} سجل بنجاح${skipped?(' (تم تجاهل '+skipped+' صف فارغ)'):''}`);
    }catch(err){
      toast('حدث خطأ أثناء قراءة الملف - تأكد إنه بنفس شكل القالب المُحمَّل', true);
    }
    document.getElementById('import-excel-file').value = '';
    IMPORT_TYPE = null;
  };
  reader.readAsArrayBuffer(file);
}
function importAllData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      DB = Object.assign(emptyDB(), data);
      DB.settings = Object.assign({capital:0}, data.settings || {});
      saveDB();
      toast('تم استيراد النسخة الاحتياطية بنجاح');
      showTab(STATE.tab);
    }catch(err){ toast('ملف غير صالح', true); }
  };
  reader.readAsText(file);
}

/* ================== التنقل ================== */
const STATE = { tab: 'dashboard' };
const TABS = [
  {id:'dashboard', label:'🏠 لوحة التحكم'},
  {id:'items', label:'📦 الأصناف'},
  {id:'inventory', label:'📊 المخزون'},
  {id:'newPurchase', label:'🧾 فاتورة مشتريات'},
  {id:'newSale', label:'🛒 فاتورة مبيعات'},
  {id:'sales', label:'📈 سجل المبيعات'},
  {id:'purchases', label:'📥 سجل المشتريات'},
  {id:'customers', label:'👥 العملاء'},
  {id:'suppliers', label:'🏭 الموردون'},
  {id:'sellers', label:'🧑‍💼 البائعين'},
  {id:'debts', label:'💳 مديونات التجار'},
  {id:'supplierPayments', label:'💰 مدفوعات الموردين'},
  {id:'expenses', label:'🧾 المصروفات'},
  {id:'treasury', label:'🏦 الخزينة والبنك'},
  {id:'profit', label:'📈 تقرير الأرباح'},
  {id:'investment', label:'💹 معادلة الاستثمار'},
  {id:'funders', label:'🤝 الممول'},
  {id:'reports', label:'📋 التقارير'},
];
function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label; b.id = 'nav-'+t.id;
    b.onclick = ()=> showTab(t.id);
    nav.appendChild(b);
  });
}
function showTab(id){
  STATE.tab = id;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('nav-'+id); if(btn) btn.classList.add('active');
  RENDERERS[id]();
}
function panelHead(title, exportFn){
  return `<div class="panel-head"><h2>${title}</h2>${exportFn?`<button class="btn-sm btn-export" onclick="${exportFn}">📊 تصدير Excel</button>`:''}</div>`;
}

/* ================== المشتقات المحسوبة ================== */
function computeStock(){
  return DB.items.map(it=>{
    const totalIn = DB.purchases.filter(p=>p.itemCode===it.code).reduce((s,p)=>s+Number(p.qty||0),0);
    const totalOut = DB.sales.filter(s=>s.itemCode===it.code).reduce((s,r)=>s+Number(r.qty||0),0);
    const balance = totalIn - totalOut;
    return { code:it.code, name:it.name, category:it.category, totalIn, totalOut, balance,
      status: balance <= Number(it.minStock||0) ? 'تنبيه: أعد الطلب' : 'متوفر' };
  });
}
function computeCustomers(){
  return DB.customers.map(c=>{
    const totalPurchases = DB.sales.filter(s=>s.customerCode===c.code).reduce((s,r)=>s+Number(r.total||0),0);
    const cashPaid = DB.sales.filter(s=>s.customerCode===c.code && s.saleType==='نقدي').reduce((s,r)=>s+Number(r.total||0),0);
    const installmentPaid = DB.debts.filter(d=>d.customerCode===c.code && d.paidDate).reduce((s,r)=>s+Number(r.amount||0),0);
    const totalPaid = cashPaid + installmentPaid;
    return Object.assign({}, c, {totalPurchases, totalPaid, balanceDue: totalPurchases-totalPaid});
  });
}
function computeSuppliers(){
  return DB.suppliers.map(s=>{
    const totalPurchases = DB.purchases.filter(p=>p.supplierName===s.name).reduce((sum,r)=>sum+Number(r.total||0),0);
    const totalPaid = DB.supplierPayments.filter(p=>p.supplierName===s.name).reduce((sum,r)=>sum+Number(r.amount||0),0);
    return Object.assign({}, s, {totalPurchases, totalPaid, balanceDue: totalPurchases-totalPaid});
  });
}
function computeSellers(){
  return DB.sellers.map(s=>{
    const mySales = DB.sales.filter(r=>r.sellerName===s.name);
    return Object.assign({}, s, {
      totalSales: mySales.reduce((sum,r)=>sum+Number(r.total||0),0),
      totalCommission: mySales.reduce((sum,r)=>sum+Number(r.commission||0),0)
    });
  });
}
function computeDebts(){
  const t = new Date(); t.setHours(0,0,0,0);
  return DB.debts.map(d=>{
    let status;
    if(d.paidDate) status = 'مدفوع';
    else if(d.dueDate && new Date(d.dueDate) < t) status = 'متأخر';
    else status = 'مستحق';
    return Object.assign({}, d, {status});
  });
}
function netProfitTotal(){
  const totalProfit = DB.sales.reduce((s,r)=>s+Number(r.profit||0),0);
  const totalExpenses = DB.expenses.reduce((s,r)=>s+Number(r.amount||0),0);
  return totalProfit - totalExpenses;
}
function computeTreasury(){
  let entries = [];
  DB.sales.filter(s=>s.saleType==='نقدي').forEach(s=> entries.push({id:'s-'+s.id, date:s.date, type:'قبض', method:s.collectionMethod||'كاش', amount:Number(s.total||0), description:'بيع نقدي - فاتورة '+s.invoiceNo, source:'auto'}));
  DB.debts.filter(d=>d.paidDate).forEach(d=> entries.push({id:'d-'+d.id, date:d.paidDate, type:'قبض', method:d.collectionMethod||'كاش', amount:Number(d.amount||0), description:'تحصيل آجل - فاتورة '+d.invoiceNo, source:'auto'}));
  DB.supplierPayments.forEach(p=> entries.push({id:'sp-'+p.id, date:p.date, type:'صرف', method:p.method, amount:Number(p.amount||0), description:'دفعة لمورد: '+p.supplierName, source:'auto'}));
  DB.expenses.forEach(e=> entries.push({id:'ex-'+e.id, date:e.date, type:'صرف', method:e.method, amount:Number(e.amount||0), description:e.category+(e.description?(' - '+e.description):''), source:'auto'}));
  DB.treasuryEntries.forEach(t=> entries.push({id:t.id, date:t.date, type:t.type, method:t.method, amount:Number(t.amount||0), description:t.description||'حركة يدوية', source:'manual'}));
  entries.sort((a,b)=> new Date(a.date||0) - new Date(b.date||0));
  let balCash=0, balBank=0;
  entries.forEach(e=>{
    const sign = e.type==='قبض' ? 1 : -1;
    if(e.method==='بنك') balBank += sign*e.amount; else balCash += sign*e.amount;
    e.runningCash = balCash; e.runningBank = balBank;
  });
  return {entries: entries.slice().reverse(), cashBalance: balCash, bankBalance: balBank};
}
function computeMonthlyProfit(){
  const map = {};
  DB.sales.forEach(s=>{
    const m = (s.date||'').slice(0,7); if(!m) return;
    map[m] = map[m] || {month:m, sales:0, cost:0, profit:0, expenses:0};
    map[m].sales += Number(s.total||0); map[m].cost += Number(s.cost||0); map[m].profit += Number(s.profit||0);
  });
  DB.expenses.forEach(e=>{
    const m=(e.date||'').slice(0,7); if(!m) return;
    map[m] = map[m] || {month:m, sales:0, cost:0, profit:0, expenses:0};
    map[m].expenses += Number(e.amount||0);
  });
  return Object.values(map).map(r=> Object.assign(r,{netProfit: r.profit - r.expenses})).sort((a,b)=> b.month.localeCompare(a.month));
}
function computeFunders(){
  const netProfit = netProfitTotal();
  return DB.funders.map(f=>{
    const share = netProfit * (Number(f.sharePct||0)/100);
    const roi = Number(f.investedAmount||0)>0 ? (share/Number(f.investedAmount)*100) : 0;
    return Object.assign({}, f, {profitShare: share, roi});
  });
}

function submitSale(){
  const lines = saleLines.filter(l=>l.itemCode && Number(l.qty)>0);
  if(!lines.length){ toast('أضف صنف واحد على الأقل', true); return; }
  const customerCode = val('sl-customer');
  if(!customerCode){ toast('اختر العميل', true); return; }
  const invoiceNo = nextInvoiceNo(DB.sales, 'invoiceNo', 'S', 5);
  const date = val('sl-date');
  const saleType = val('sl-type');
  const sellerName = val('sl-seller');
  const commissionPct = Number(val('sl-pct')||0);
  const collectionMethod = val('sl-collect');
  let invoiceTotal = 0;
  lines.forEach(l=>{
    const it = DB.items.find(i=>i.code===l.itemCode);
    const qty = Number(l.qty);
    const total = qty * Number(it.sellPrice);
    const cost = qty * Number(it.buyPrice);
    const profit = total - cost;
    const commission = profit * commissionPct;
    const shelfLife = Number(it.shelfLifeDays||0);
    const expiryDate = shelfLife ? new Date(new Date(date).getTime()+shelfLife*86400000).toISOString().split('T')[0] : '';
    const lot = 'LOT-'+Math.floor(100000+Math.random()*900000);
    const status = saleType==='آجل' ? 'غير مدفوع (آجل)' : 'مدفوع نقدًا';

      total, cost, profit, saleType, customerCode, sellerName, commissionPct, commission, lot,
      shelfLifeDays:shelfLife, expiryDate, status, collectionMethod});
    invoiceTotal += total;
  });
  if(saleType==='آجل'){
    DB.debts.push({id:uid(), invoiceNo, customerCode, amount:invoiceTotal, dueDate: val('sl-due'), paidDate:'', notes:'', collectionMethod});

  const totalSales = DB.sales.reduce((s,r)=>s+Number(r.total||0),0);
  const netProfit = netProfitTotal();
  const roi = capital>0 ? (netProfit/capital*100) : 0;
  const turnover = capital>0 ? (totalSales/capital) : 0;
  document.getElementById('main').innerHTML = `
    <div class="panel"><div class="panel-head"><h2>💹 رأس المال المستثمر</h2></div>
      <div class="form-row">
        <input id="inv-capital" type="number" placeholder="رأس المال المستثمر" value="${capital || ''}">
      </div>
      <button class="btn-primary" onclick="saveCapital()">حفظ رأس المال</button>
    </div>
    <div class="cards">
      <div class="card"><div class="val">${fmt(capital)}</div><div class="lbl">رأس المال المستثمر</div></div>
      <div class="card" style="border-color:var(--success)"><div class="val">${fmt(netProfit)}</div><div class="lbl">صافي الربح</div></div>
      <div class="card" style="border-color:var(--accent)"><div class="val">${fmt(roi)}%</div><div class="lbl">نسبة العائد على الاستثمار (ROI)</div></div>
      <div class="card" style="border-color:#0f766e"><div class="val">${fmt(turnover)}</div><div class="lbl">معدل دوران رأس المال (المبيعات ÷ رأس المال)</div></div>
    </div>
    <div class="panel"><p style="font-size:13px;color:var(--muted);margin:0">
      <b>معادلة العائد على الاستثمار:</b> نسبة العائد = (صافي الربح ÷ رأس المال المستثمر) × 100.<br>
      <b>معدل دوران رأس المال:</b> يوضح كم مرة "دار" رأس المال في شكل مبيعات خلال الفترة.
    </p></div>`;
}
function saveCapital(){
  DB.settings.capital = Number(val('inv-capital')||0);
  saveDB(); toast('تم حفظ رأس المال'); renderInvestment();
}

/* ================== الممول (إضافة / تعديل / حذف) ================== */
function renderFunders(){
  const rows = computeFunders();
  const editing = EDIT.funders ? DB.funders.find(f=>f.id===EDIT.funders) : null;
  document.getElementById('main').innerHTML = `
    <div class="panel"><div class="panel-head"><h2>${editing?'✏️ تعديل ممول':'➕ إضافة ممول / شريك'}</h2></div>
      ${editing?`<span class="edit-badge">جاري تعديل: ${editing.name}</span>`:''}
      <div class="form-row">
        <input id="fu-name" placeholder="اسم الممول / الشريك" value="${editing?editing.name:''}">
        <input id="fu-phone" placeholder="رقم الهاتف" value="${editing?editing.phone||'':''}">
        <input id="fu-amount" type="number" placeholder="المبلغ المستثمر" value="${editing?editing.investedAmount:''}">
        <input id="fu-pct" type="number" step="0.01" placeholder="نسبة الحصة من الربح % (مثال 25)" value="${editing?editing.sharePct:''}">
      </div>
      <button class="btn-primary" onclick="saveFunder()">${editing?'حفظ التعديل':'حفظ الممول'}</button>
      ${editing?`<button class="btn-secondary" onclick="EDIT.funders=null; renderFunders();">إلغاء</button>`:''}
    </div>
    <div class="panel">${panelHead('🤝 قائمة الممولين والشركاء ('+rows.length+')', 'exportXLSX(computeFunders(),"الممول")')}
    <div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>المبلغ المستثمر</th><th>نسبة الحصة%</th><th>نصيبه من الربح</th><th>عائد استثماره%</th><th></th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r.name}</td><td>${r.phone||''}</td><td>${fmt(r.investedAmount)}</td><td>${r.sharePct}</td><td style="font-weight:700;color:${r.profitShare>=0?'var(--success)':'var(--danger)'}">${fmt(r.profitShare)}</td><td>${fmt(r.roi)}%</td>
    <td><button class="btn-edit" onclick="EDIT.funders='${r.id}'; renderFunders(); window.scrollTo(0,0);">تعديل</button><button class="btn-del" onclick="deleteFunder('${r.id}')">حذف</button></td></tr>`).join('') || '<tr><td colspan=7 class="empty">لا يوجد ممولون مسجلون</td></tr>'}</tbody></table></div></div>`;
}
function saveFunder(){
  const name = val('fu-name');
  if(!name){ toast('اكتب اسم الممول', true); return; }
  const data = {name, phone:val('fu-phone'), investedAmount:Number(val('fu-amount')||0), sharePct:Number(val('fu-pct')||0)};
  if(EDIT.funders){
    Object.assign(DB.funders.find(f=>f.id===EDIT.funders), data);
    EDIT.funders = null; toast('تم تحديث بيانات الممول');
  }else{
    DB.funders.push({id:uid(), ...data});
    toast('تم إضافة الممول');
  }
  saveDB(); renderFunders();
}
function deleteFunder(id){
  if(!confirmDelete()) return;
  DB.funders = DB.funders.filter(f=>f.id!==id);
  saveDB(); toast('تم حذف الممول'); renderFunders();
}

/* ================== التقارير (ملخص شامل) ================== */
function renderReports(){
  const totalSales = DB.sales.reduce((s,r)=>s+Number(r.total||0),0);
  const totalProfit = DB.sales.reduce((s,r)=>s+Number(r.profit||0),0);
  const totalPurchases = DB.purchases.reduce((s,r)=>s+Number(r.total||0),0);
  const totalExpenses = DB.expenses.reduce((s,r)=>s+Number(r.amount||0),0);
  const netProfit = totalProfit - totalExpenses;
  const debts = computeDebts();
  const dueDebts = debts.filter(d=>d.status!=='مدفوع').reduce((s,r)=>s+Number(r.amount||0),0);
  const suppliersDue = computeSuppliers().reduce((s,r)=>s+Math.max(0,r.balanceDue),0);
  const tr = computeTreasury();
  const topItems = computeStock().slice().sort((a,b)=> (DB.sales.filter(s=>s.itemCode===b.code).reduce((x,r)=>x+Number(r.total||0),0)) - (DB.sales.filter(s=>s.itemCode===a.code).reduce((x,r)=>x+Number(r.total||0),0))).slice(0,5);
  document.getElementById('main').innerHTML = `
    <div class="panel"><div class="panel-head"><h2>📋 ملخص شامل للنظام</h2><button class="btn-sm btn-export" onclick="exportAllToExcel()">📊 تصدير تقرير شامل Excel</button></div>
      <div class="cards">
        <div class="card"><div class="val">${fmt(totalSales)}</div><div class="lbl">إجمالي المبيعات</div></div>
        <div class="card" style="border-color:var(--accent)"><div class="val">${fmt(totalPurchases)}</div><div class="lbl">إجمالي المشتريات</div></div>
        <div class="card" style="border-color:var(--danger)"><div class="val">${fmt(totalExpenses)}</div><div class="lbl">إجمالي المصروفات</div></div>
        <div class="card" style="border-color:var(--success)"><div class="val">${fmt(netProfit)}</div><div class="lbl">صافي الربح</div></div>
        <div class="card" style="border-color:#b45309"><div class="val">${fmt(dueDebts)}</div><div class="lbl">مديونات آجل مستحقة (لنا)</div></div>
        <div class="card" style="border-color:#b45309"><div class="val">${fmt(suppliersDue)}</div><div class="lbl">مستحق للموردين (علينا)</div></div>
        <div class="card"><div class="val">${fmt(tr.cashBalance)}</div><div class="lbl">رصيد النقدية</div></div>
        <div class="card"><div class="val">${fmt(tr.bankBalance)}</div><div class="lbl">رصيد البنك</div></div>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><h2>🏆 أفضل 5 أصناف مبيعًا</h2></div>
      <div class="table-wrap"><table><thead><tr><th>الصنف</th><th>الرصيد الحالي</th><th>الحالة</th></tr></thead>
      <tbody>${topItems.map(i=>`<tr><td>${i.name}</td><td>${i.balance}</td><td><span class="tag ${i.status==='متوفر'?'tag-ok':'tag-warn'}">${i.status}</span></td></tr>`).join('') || '<tr><td colspan=3 class="empty">لا توجد بيانات</td></tr>'}</tbody></table></div>
    </div>
    <div class="panel"><p style="font-size:12px;color:var(--muted);margin:0">لتقارير أكثر تفصيلًا (شهري، حسب البائع، حسب الصنف) راجع صفحات: سجل المبيعات، تقرير الأرباح، البائعين، المخزون — وكلها قابلة للتصدير Excel من نفس الصفحة.</p></div>`;
}

const RENDERERS = {
  dashboard: renderDashboard, items: renderItems, inventory: renderInventory,
  newPurchase: renderNewPurchase, newSale: renderNewSale, sales: renderSales,
  purchases: renderPurchases, customers: renderCustomers, suppliers: renderSuppliers,
  sellers: renderSellers, debts: renderDebts, supplierPayments: renderSupplierPayments,
  expenses: renderExpenses, treasury: renderTreasury, profit: renderProfit,
  investment: renderInvestment, funders: renderFunders, reports: renderReports
};

/* ================== بدء التشغيل ================== */
buildNav();

/* ================== شاشة الدخول (حماية النظام) ================== */
// ⚠️ لتغيير كلمة السر: عدّل النص بين علامتي التنصيص في السطر التالي فقط
const SITE_PASSWORD = "2026";
const LOCK_KEY = 'bar3y_unlocked_session';

function tryUnlock(){
  const entered = document.getElementById('lock-pass').value;
  if(entered === SITE_PASSWORD){
    sessionStorage.setItem(LOCK_KEY, '1');
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('lock-error').textContent = '';
    showTab('dashboard');
  }else{
    document.getElementById('lock-error').textContent = 'كلمة السر غير صحيحة';
  }
}
function lockApp(){
  sessionStorage.removeItem(LOCK_KEY);
  document.getElementById('lock-pass').value = '';
  document.getElementById('lock-error').textContent = '';
  document.getElementById('lock-screen').style.display = 'flex';
}
if(sessionStorage.getItem(LOCK_KEY) === '1'){
  document.getElementById('lock-screen').style.display = 'none';
  showTab('dashboard');
}

</script>
</body>
</html>
